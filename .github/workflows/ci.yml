name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test --group dev
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run python -m corpus.support_page --check
      - run: uv run pytest -q -m timing

  test-sail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test --group dev
      - run: uv run pytest -q -n auto --dist worksteal --durations=12
      - run: SPARKWARP=1 uv run pytest benchmarks -q
      - run: SPARKWARP=1 uv run pytest corpus -q
      - run: uv run python -m benchmarks.run --engines sail --runs 1 --max-sail-seconds 6 --output /tmp/sail-results.md --json /tmp/sail-results.json

  test-pyspark-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        pyspark: ["4.0.0", "4.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra test --group dev
      - run: uv pip install "pyspark[connect]==${{ matrix.pyspark }}"
      - run: uv run --no-sync pytest -q -n auto --dist worksteal --durations=12
      - run: SPARKWARP=1 uv run --no-sync pytest corpus -q

  parity-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test --group dev
      - run: SPARKWARP=0 uv run pytest benchmarks -q
      - run: SPARKWARP=0 uv run pytest corpus -q
